'use strict';
const COMMON = `
precision highp float;
precision highp int;
// Artistic and physical tuning, in metres, seconds and radians.
const float PI=3.14159265359;
const float TAU=6.28318530718;
const float GRAVITY=9.81;
const float SUN_ELEVATION=0.06981317008;
const float SUN_RADIUS=0.00471238898;
const vec3 SUN_DIR=vec3(0.0,0.069756474,-0.99756405);
const vec3 SUN_COLOR=vec3(1.0,0.66,0.34);
const float SUN_RADIANCE=60.0;
const float SUN_IRRADIANCE=3.0;
const vec3 ZENITH=vec3(0.030,0.095,0.420);
const vec3 HORIZON_SUN=vec3(1.0,0.62,0.32);
const vec3 HORIZON_AWAY=vec3(0.48,0.32,0.47);
const vec3 ABSORPTION=vec3(0.45,0.09,0.05);
const vec3 SCATTER=vec3(0.02,0.09,0.12);
const float BASE_ROUGHNESS=0.04;
const float FOAM_THRESHOLD=0.78;

const float CLOUD_HAZE_END=0.105;
const float PANORAMA_ELEVATION_POWER=2.0;
const float DISTANCE_ROUGHNESS=0.00020;
const int WATER_MARCH_STEPS=32;
const int GOD_RAY_STEPS=10;
const float CLOUD_BOTTOM=1500.0;
const float CLOUD_TOP=3000.0;
const float CLOUD_COVERAGE=0.71;
const float CLOUD_EXTINCTION=0.0045;
const float CLOUD_WIND=3.0;
const vec3 DEEP_WATER=vec3(0.0,0.02,0.05);
const float EXPOSURE=1.05;
const float BLOOM_STRENGTH=0.055;
const float VIGNETTE=0.25;
const float GRAIN=0.02;
const float WAVE_RATIO=0.6344941742; // (2 / 120)^(1 / 9)
const float AMPLITUDES[10]=float[10](0.60,0.35,0.22,0.16,0.115,0.078,0.053,0.035,0.024,0.016);
const float ANGLES[10]=float[10](0.06,-0.32,0.49,-0.68,0.90,-0.16,0.65,-1.02,0.27,-0.52);
const float PHASES[10]=float[10](0.4,2.1,4.8,1.3,5.5,3.2,0.7,4.2,2.7,5.9);
const float STEEPNESS[10]=float[10](0.16,0.15,0.14,0.13,0.12,0.11,0.10,0.09,0.08,0.07);
uniform float uTime;
float sat(float x){return clamp(x,0.0,1.0);}
vec3 safeNorm(vec3 v){return v*inversesqrt(max(dot(v,v),1e-8));}
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 hash33(vec3 p){return vec3(hash13(p),hash13(p+17.17),hash13(p+43.73));}
vec3 grad3(vec3 p){return safeNorm(hash33(p)*2.0-1.0);}
float perlin(vec3 p){

 float a=dot(grad3(i),f),b=dot(grad3(i+vec3(1,0,0)),f-vec3(1,0,0));
 float c=dot(grad3(i+vec3(0,1,0)),f-vec3(0,1,0)),d=dot(grad3(i+vec3(1,1,0)),f-vec3(1,1,0));
 float e=dot(grad3(i+vec3(0,0,1)),f-vec3(0,0,1)),g=dot(grad3(i+vec3(1,0,1)),f-vec3(1,0,1));
 float h=dot(grad3(i+vec3(0,1,1)),f-vec3(0,1,1)),j=dot(grad3(i+vec3(1,1,1)),f-vec3(1,1,1));

}
float worley(vec3 p){vec3 i=floor(p),f=fract(p);float d=4.0;for(int z=-1;z<=1;z++)for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec3 b=vec3(x,y,z);vec3 r=b+hash33(i+b)-f;d=min(d,dot(r,r));}return sqrt(max(d,1e-4));}
float fbm(vec3 p){float n=0.0,a=0.57;for(int i=0;i<3;i++){n+=a*perlin(p);p=p*2.03+vec3(12.1,3.7,7.9);a*=0.5;}return n;}
// Gradient noise and its exact spatial derivative for the normal-only ripples.
vec3 noise2D(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*f*(f*(f*6.0-15.0)+10.0),du=30.0*f*f*(f-1.0)*(f-1.0);

 vec2 gb=vec2(cos(TAU*hash12(i+vec2(1,0))),sin(TAU*hash12(i+vec2(1,0))));

 vec2 dn=mix(mix(ga,gb,u.x),mix(gc,gd,u.x),u.y)+du*vec2(mix(b-a,d-c,u.y),mix(c-a,d-b,u.x));return vec3(n,dn);

struct Water{float h;vec3 n;float jac;float lost;float ripple;};
float waveFade(float wavelength,float fp){return smoothstep(2.0*fp,4.0*fp,wavelength);}
// Invert the horizontal Gerstner displacement to evaluate an Eulerian x/z point.
vec2 waveParam(vec2 x,float fp){vec2 q=x;for(int j=0;j<4;j++){vec2 disp=vec2(0);mat2 jac=mat2(1);float wavelength=120.0;
 for(int i=0;i<10;i++){float k=TAU/wavelength,f=waveFade(wavelength,fp);if(f<=0.0)break;vec2 dir=vec2(sin(ANGLES[i]),cos(ANGLES[i]));float phase=k*dot(dir,q)-sqrt(GRAVITY*k)*uTime+PHASES[i];float s=STEEPNESS[i]*f;disp+=dir*(s/k)*cos(phase);jac-=s*sin(phase)*outerProduct(dir,dir);wavelength*=WAVE_RATIO;}

float heightOnly(vec2 x,float fp){

 for(int i=0;i<10;i++){float f=waveFade(wavelength,fp);if(f<=0.0)break;
  float k=TAU/wavelength;vec2 dir=vec2(sin(ANGLES[i]),cos(ANGLES[i]));
  height+=AMPLITUDES[i]*f*sin(k*dot(dir,q)-sqrt(GRAVITY*k)*uTime+PHASES[i]);wavelength*=WAVE_RATIO;
 }return height;
}
Water water(vec2 x,float fp,bool detail){
 vec2 q=waveParam(x,fp);float height=0.0,lost=0.0;vec3 dx=vec3(1,0,0),dz=vec3(0,0,1);float wavelength=120.0;
 for(int i=0;i<10;i++){float k=TAU/wavelength,f=waveFade(wavelength,fp);lost+=0.5*pow(AMPLITUDES[i]*k,2.0)*(1.0-f*f);if(f<=0.0){wavelength*=WAVE_RATIO;continue;}vec2 dir=vec2(sin(ANGLES[i]),cos(ANGLES[i]));float phase=k*dot(dir,q)-sqrt(GRAVITY*k)*uTime+PHASES[i];float s=sin(phase),c=cos(phase),a=AMPLITUDES[i]*f,steep=STEEPNESS[i]*f;
 height+=a*s;dx+=vec3(-steep*dir.x*dir.x*s,a*k*dir.x*c,-steep*dir.x*dir.y*s);dz+=vec3(-steep*dir.x*dir.y*s,a*k*dir.y*c,-steep*dir.y*dir.y*s);wavelength*=WAVE_RATIO;}
 vec3 n=safeNorm(cross(dz,dx));float ripple=0.0;
 if(detail){float wl=1.5;for(int i=0;i<2;i++){float f=waveFade(wl,fp),strength=i==0?0.075:0.045;vec3 nd=vec3(0);if(f>0.0)nd=noise2D(x/wl+vec2(uTime*0.11,-uTime*0.17)*(float(i)+1.0));n.xz-=nd.yz*strength*f;n=safeNorm(n);lost+=strength*strength*0.5*(1.0-f*f);ripple+=strength*f;wl=0.3;}}

}
float hg(float c,float g){return (1.0-g*g)/(4.0*PI*pow(max(1.0+g*g-2.0*g*c,1e-4),1.5));}
vec3 clearSky(vec3 rd,bool disc){
 float y=max(rd.y,0.0),toward=pow(sat(dot(safeNorm(vec3(rd.x,0,rd.z)),vec3(0,0,-1))*0.5+0.5),4.0);
 vec3 horizon=mix(HORIZON_AWAY,HORIZON_SUN,toward);float horizonWeight=exp(-y*10.5);
 vec3 col=mix(ZENITH,horizon,horizonWeight);float mu=clamp(dot(rd,SUN_DIR),-1.0,1.0);

 if(disc){float angle=acos(mu),r=angle/SUN_RADIUS;float edge=1.0-smoothstep(0.96,1.04,r);float limb=0.45+0.55*sqrt(max(1.0-r*r,0.0));col+=SUN_COLOR*SUN_RADIANCE*edge*limb;}
 return col;
}
float perlinWorleyFBM(vec3 p){
 float value=0.0,weight=0.57;
 for(int octave=0;octave<3;octave++){
  float cell=1.0-worley(p*2.0+vec3(3,1,7));
  value+=weight*(perlin(p)*0.75+(cell-0.45)*0.20);
  p=p*2.03+vec3(12.1,3.7,7.9);weight*=0.5;
 }
 return value;
}
float cloudDensity(vec3 p){

 float shape=0.56+perlinWorleyFBM(q)-CLOUD_COVERAGE;
 float profile=smoothstep(0.0,0.15,h)*(1.0-smoothstep(0.48,1.0,h));

}
vec3 skyMarch(vec3 ro,vec3 rd,float jitter,bool disc){

 end=min(end,start+22000.0);if(end<=start)return background;
 int count=int(mix(14.0,32.0,smoothstep(0.04,0.5,rd.y)));float stepLen=(end-start)/float(count),trans=1.0;vec3 sum=vec3(0);
 float cosine=dot(rd,SUN_DIR),phase=0.8*hg(cosine,0.6)+0.2*hg(cosine,-0.2);
 // Stable midpoint quadrature resolves the smooth puffs without pixel hash grain.
 for(int i=0;i<32;i++){if(i>=count||trans<0.015)break;float t=start+(float(i)+0.5)*stepLen;vec3 p=ro+rd*t;float d=cloudDensity(p);if(d<0.005)continue;
 float optical=0.0;for(int j=0;j<3;j++){float lt=(float(j)+0.5)*350.0;optical+=cloudDensity(p+SUN_DIR*lt)*350.0*CLOUD_EXTINCTION;}
 float beer=exp(-optical),powder=2.0*(1.0-exp(-2.0*d));

 vec3 lighting=ambient+SUN_COLOR*(beer*(0.55+phase*5.0)*powder+pow(beer,3.0)*phase*0.7);

 }

`;
const PANORAMA_FS = `#version 300 es
${COMMON}
in vec2 vUV; out vec4 fragColor;
uniform vec2 uPanoramaSize;
// Upper hemisphere: quadratic elevation packs rows around the warm horizon.
// gl_FragCoord already includes the strip viewport's absolute row offset.
void main(){vec2 uv=gl_FragCoord.xy/uPanoramaSize;float lon=(uv.x-0.5)*TAU;
 float lat=pow(uv.y,PANORAMA_ELEVATION_POWER)*PI*0.5;
 vec3 rd=vec3(cos(lat)*cos(lon),sin(lat),cos(lat)*sin(lon));
 fragColor=vec4(max(skyMarch(vec3(0),rd,0.0,false),vec3(0)),1);}

`;
const SCENE_FS = `#version 300 es
${COMMON}
in vec2 vUV;
out vec4 fragColor;
uniform vec2 uResolution;
uniform vec3 uCamera;
uniform mat3 uCameraBasis;
uniform bool uHDR;
uniform float uAltitude;
uniform sampler2D uPanorama;
uniform vec2 uPanoramaSize;
float pixelAngle;
vec3 skyFromPanorama(vec3 rd){
 rd=safeNorm(rd);float lon=atan(rd.z,rd.x),lat=asin(clamp(rd.y,0.0,1.0));
 vec2 uv=vec2(lon/TAU+0.5,pow(lat/(PI*0.5),1.0/PANORAMA_ELEVATION_POWER));
 vec3 col=texture(uPanorama,uv).rgb;
 // A small angular reconstruction filter softens distant puffs before they enter haze.
 float softness=1.0-smoothstep(0.10,0.28,rd.y);
 if(softness>0.0){vec2 offset=vec2(1.25,2.0)*softness/uPanoramaSize;
  col=col*0.4+0.15*(texture(uPanorama,uv+vec2(offset.x,0)).rgb+texture(uPanorama,uv-vec2(offset.x,0)).rgb
   +texture(uPanorama,uv+vec2(0,offset.y)).rgb+texture(uPanorama,uv-vec2(0,offset.y)).rgb);
 }return col;
}
// Pixel footprint also bounds the march's wave count at long distances.
float geometryFootprint(float t){return t*max(pixelAngle,0.0015);}
float surfaceResidual(vec3 ro,vec3 rd,float t){vec3 p=ro+rd*t;return p.y-heightOnly(p.xz,geometryFootprint(t));}
bool intersectWater(vec3 ro,vec3 rd,out vec3 hit,out Water surface){
 if(ro.y>1.76&&rd.y>=0.0){hit=ro;surface=Water(0.0,vec3(0,1,0),1.0,0.0,0.0);return false;}
 // The CPU evaluates the identical unfiltered Gerstner sum once for the camera.
 float initial=uAltitude,previous=0.0,prevF=initial;
 float limit=40000.0,t=0.04;bool bracket=false;
 // Flat-plane estimate supplies an initial candidate, bounded by the full wave envelope.
 if(initial*rd.y<0.0&&abs(rd.y)>0.025){
  float plane=clamp(-ro.y/rd.y,0.04,limit);
  float nearBound=max(0.04,plane-1.76/abs(rd.y));
  t=nearBound;
  // Steep views have a unique crossing: seed a bracket directly from the estimate.
  if(abs(rd.y)>0.65){float guess=clamp(plane+heightOnly((ro+rd*plane).xz,geometryFootprint(plane))/rd.y,0.04,limit);float f=surfaceResidual(ro,rd,guess);

  if(bracket)break;

  if(f*initial<=0.0){bracket=true;break;}
  if(abs(f)<0.002){previous=t;prevF=f;bracket=true;break;}
  previous=t;prevF=f;
  float slopeBound=0.0,wavelength=120.0,fp=geometryFootprint(t);
  for(int j=0;j<10;j++){float fade=waveFade(wavelength,fp);if(fade<=0.0)break;slopeBound+=AMPLITUDES[j]*(TAU/wavelength)*fade;wavelength*=WAVE_RATIO;}

}
// Surface-only BRDF: Cox-Munk slopes, disc-widened GGX and correlated Smith.
float fresnelWater(float NoV,float roughness){

}
float ggxD(float NoH,float alpha){float a2=alpha*alpha,d=(NoH*a2-NoH)*NoH+1.0;return a2/max(PI*d*d,1e-8);}
float smithGGXCorrelated(float NoV,float NoL,float alpha){

vec3 waterReflection(vec3 r,float alpha){
